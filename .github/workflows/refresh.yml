name: Daily Technical Refresh

on:
  schedule:
    # Weekdays at 10:30 UTC = 4:00 PM IST (30 min after NSE close)
    - cron: "30 10 * * 1-5"
  workflow_dispatch:
    inputs:
      phase:
        description: "Pipeline phase to run"
        required: false
        default: "technical"
        type: choice
        options: [technical, fundamental, concall, macro, score, all]

jobs:
  refresh:
    name: Run pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps (tesseract for OCR fallback)
        run: sudo apt-get install -y tesseract-ocr

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python deps
        run: uv sync

      - name: Run pipeline
        run: uv run python run.py --phase ${{ github.event.inputs.phase || 'technical' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
